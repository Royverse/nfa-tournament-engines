name: Forecaster — job

# Reusable job behind every forecaster workflow. It runs the Python engine in
# forecaster/ on a GitHub runner, using this repo's Actions secrets.
#
# This repo is public, so its run logs are public. A live run sets
# FORECASTER_REDACT_LIVE=1: forecast values and reasoning stay out of the log
# and the summary until each question closes (the bot's Metaculus comment
# carries the reasoning). Smoke and dry runs on the bot-testing area are not
# redacted.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   METACULUS_TOKEN            the prize bot's API token            (required)
#   METACULUS_TOKEN_V2         a second, labelled test bot           (optional)
#   FORECASTER_OPENROUTER_KEY  optional paid OpenRouter key         (if self-funded)
#   GEMINI_API_KEY             already present — free ensemble, Gemma reserve,
#                              and Google-grounded web search
#   GROQ_API_KEY               already present — free reserve models (Groq)
#   OPENROUTER_API_KEY         already present (the trading app's key) — reaches
#                              the engine as OPENROUTER_FREE_KEY and is used for
#                              OpenRouter ":free" models ONLY, which never bill
#   ASKNEWS_API_KEY            news search (my.asknews.app)          (optional)
#   ALPHA_VANTAGE_API_KEY      already present — stock-data fallback only
# Variables (… → Variables): any FORECASTER_* setting, see forecaster/README.md.

on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true
      command:
        type: string
        required: true

permissions:
  contents: read

jobs:
  forecaster:
    name: ${{ inputs.command }} · ${{ inputs.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: forecaster-${{ inputs.variant }}-${{ inputs.command == 'run' && 'run' || 'check' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: forecaster
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: forecaster

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: forecaster/requirements.txt

      - name: Install
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Forecaster ${{ inputs.command }}
        env:
          COMMAND: ${{ inputs.command }}
          FORECASTER_VARIANT: ${{ inputs.variant }}
          FORECASTER_REDACT_LIVE: ${{ inputs.command == 'run' && '1' || '' }}
          FORECASTER_VARS_JSON: ${{ toJSON(vars) }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          METACULUS_TOKEN_V2: ${{ secrets.METACULUS_TOKEN_V2 }}
          # Optional user-funded OpenRouter key (if set); engine defaults
          # to zero-cost multi-provider ensemble.
          OPENROUTER_API_KEY: ${{ secrets.FORECASTER_OPENROUTER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Deliberately a different name: the engine gives this key to
          # ":free" models only (bot.make_llm), so it can never spend money.
          OPENROUTER_FREE_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        # Inputs reach the shell only through env + a fixed case table, so no
        # input text is ever interpolated into the script.
        run: |
          case "$COMMAND" in
            run)                 set -- run ;;
            smoke)               set -- smoke ;;
            dry-run)             set -- test --limit 3 ;;
            dry-run-and-publish) set -- test --limit 3 --publish ;;
            *) echo "Unknown command: $COMMAND"; exit 2 ;;
          esac
          python -m nfa_forecaster.cli "$@"

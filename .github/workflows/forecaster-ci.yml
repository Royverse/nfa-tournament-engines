name: Forecaster — CI

on:
  pull_request:
    paths:
      - 'forecaster/**'
      - '.github/workflows/forecaster-*.yml'
  push:
    branches:
      - main
    paths:
      - 'forecaster/**'
      - '.github/workflows/forecaster-*.yml'

permissions:
  contents: read

jobs:
  test:
    name: Unit + library tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forecaster
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: forecaster
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: forecaster/requirements*.txt
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -rs
